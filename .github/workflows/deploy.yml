name: Verify and deploy AI service
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-service-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check files intended for GitHub
        run: python scripts/audit_github_files.py --check
      - name: Install API test dependencies
        run: python -m pip install -r requirements-api.txt numpy==1.26.4 Pillow==11.3.0 httpx==0.28.1
      - name: Test HTTP, WebSocket and inference isolation
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_service*.py' -v

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Image tag
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update server through SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_PATH || '/opt/sibi-bisindo-ai' }}
          AI_IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          set -euo pipefail
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ && "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ && "$SSH_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_ROOT" =~ ^/[A-Za-z0-9_./-]+$ && "$DEPLOY_ROOT" != *'/../'* ]]
          [[ -n "$SSH_KEY" && -n "$KNOWN_HOSTS" ]]
          umask 077
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ai_deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/ai_known_hosts"
          options=(-i "$RUNNER_TEMP/ai_deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ai_known_hosts")
          tar -czf "$RUNNER_TEMP/ai-deploy.tgz" -C deploy compose.yaml deploy.sh
          scp -P "$SSH_PORT" "${options[@]}" "$RUNNER_TEMP/ai-deploy.tgz" "$SSH_USER@$SSH_HOST:$DEPLOY_ROOT/deploy-$GITHUB_SHA.tgz"
          ssh -p "$SSH_PORT" "${options[@]}" "$SSH_USER@$SSH_HOST" bash -s -- "$DEPLOY_ROOT" "$AI_IMAGE" "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          root=$1
          image=$2
          revision=$3
          release="$root/releases/$revision"
          mkdir -p -- "$release"
          tar -xzf "$root/deploy-$revision.tgz" -C "$release"
          bash "$release/deploy.sh" "$root" "$image"
          REMOTE
